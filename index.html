<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library - Odin Project</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="form-container">
        <form action="" method="post" id="form">
            <div>
                <h1>Title:</h1>
                <label for="titleInput"></label>
                <input type="text" id="titleInput" name="title" required placeholder="Title">
            </div>
            <div>
                <h1>Author:</h1>
                <label for="authorInput"></label>
                <input type="text" id="authorInput" name="author" required placeholder="Author">
            </div>
            <div>
                <h1>Pages:</h1>
                <label for="pagesInput"></label>
                <input type="number" id="pagesInput" name="pages" required placeholder="300">
            </div>
            <div>
                <h1>Read:</h1>
                <label for="readInput"></label>
                <select id="readInput" name="readInput" required placeholder="Yes">
                    <option>Yes</option>
                    <option>No</option>
                </select>
            </div>
            <button class="addBtn" type="submit">Add</button>
        </form>
    </div>

    <div class="container">
        <div class="cards1">
            <h1>Title:</h1>
        </div>
        <div class="cards2">
            <h1>Author:</h1>
        </div>
        <div class="cards3">
            <h1>Pages:</h1>
        </div>
        <div class="cards4">
            <h1>Read:</h1>
        </div>
        <div class="delete">
            <h1>delete</h1>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
